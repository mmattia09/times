name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Lint · Types · Import · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit

      # The rules worth pinning down: the FIDAL parser reads someone else's
      # HTML into an athlete's records and has been wrong about units, event
      # names, separators and the sign of the wind; the JSON export is the only
      # backup there is; and a string that never reaches t() ships in the wrong
      # language. All of it runs without a database.
      - name: Checks
        run: pnpm --filter web check

      - name: Build
        run: pnpm --filter web build
        env:
          # The build runs no DB/auth at compile time; a dummy secret keeps
          # Better Auth quiet during static analysis.
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0000000000
