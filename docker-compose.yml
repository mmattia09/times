services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: times
      POSTGRES_USER: times
      POSTGRES_PASSWORD: ${DB_PASSWORD:-times}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U times -d times"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # By default builds locally. To run the image published by CI, set
    # APP_IMAGE=ghcr.io/<owner>/<repo>:latest in .env, then: docker compose pull app
    image: ${APP_IMAGE:-times:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://times:${DB_PASSWORD:-times}@db:5432/times
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
