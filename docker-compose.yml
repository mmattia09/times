services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: times
      POSTGRES_USER: times
      POSTGRES_PASSWORD: ${DB_PASSWORD:-times}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Exposed only on localhost, for local development (pnpm dev, psql).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U times -d times"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - times

  app:
    # The image is built by GitHub Actions and published to GHCR — no local
    # build. Override APP_IMAGE in .env to pin a version (e.g. :1.5.0).
    image: ${APP_IMAGE:-ghcr.io/mmattia09/times:latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://times:${DB_PASSWORD:-times}@db:5432/times
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      # Compose only passes what is listed here, so a variable set in .env and
      # not named below reaches nothing: SECURE_COOKIES=false looked like it was
      # being ignored by the app because it never arrived. Empty is "unset" —
      # each of these falls back to its own default inside the app.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      UPDATE_CHECKS: ${UPDATE_CHECKS:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - times

networks:
  times:

volumes:
  postgres_data:
