services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: times
      POSTGRES_USER: times
      POSTGRES_PASSWORD: ${DB_PASSWORD:-times}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Uncomment to reach Postgres from the host (psql, `pnpm dev`). Not needed
    # in production: the app talks to it over the private network below.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U times -d times"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - times

  app:
    # Built by GitHub Actions and published to GHCR — nothing is built locally.
    # Pin a version with APP_IMAGE in .env, e.g. ghcr.io/mmattia09/times:1.7.0
    image: ${APP_IMAGE:-ghcr.io/mmattia09/times:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://times:${DB_PASSWORD:-times}@db:5432/times
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      UPDATE_CHECKS: ${UPDATE_CHECKS:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-off}
      REDIS_URL: ${REDIS_URL:-}
      NODE_ENV: production
    volumes:
      # A Docker volume by default. Set BACKUP_PATH to a host directory to keep
      # backups on a disk you already look after.
      - ${BACKUP_PATH:-backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - times

  # Optional. Only starts with `docker compose --profile redis up -d`, and only
  # does anything once REDIS_URL=redis://redis:6379 is in .env.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - times

networks:
  times:

volumes:
  postgres_data:
  backups:
